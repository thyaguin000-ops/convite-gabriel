
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriel 19 Anos</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #020817, #061a33, #07518a);
  color: white;
  text-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 100%;
  max-width: 420px;
  padding: 30px 22px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(100,180,255,0.25);
  border-radius: 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.4);
}

h1 { font-size: 34px; margin-bottom: 5px; }
h2 { font-size: 23px; font-weight: normal; margin-top: 5px; }
p { font-size: 17px; margin: 14px 0; }

input {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 20px;
  outline: none;
}

button {
  margin-top: 15px;
  padding: 13px 22px;
  width: 100%;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  background: #1688e8;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.aviso {
  font-size: 13px;
  opacity: 0.7;
  margin-top: 8px;
}

#mensagem {
  font-size: 14px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 15px;
}

li {
  margin: 8px 0;
  padding: 12px;
  background: rgba(30,130,220,0.18);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.info-nome {
  text-align: left;
  min-width: 0;
}

.nome-lista {
  display: block;
  overflow-wrap: anywhere;
  font-weight: bold;
}

.horario {
  display: block;
  font-size: 11px;
  opacity: 0.7;
  margin-top: 5px;
}

.botao-remover {
  width: auto;
  margin: 0;
  padding: 8px 12px;
  background: #c62828;
  font-size: 13px;
  flex-shrink: 0;
}

.rodape {
  margin-top: 25px;
  font-size: 13px;
  opacity: 0.55;
}
</style>
</head>

<body>

<div class="card">

<h1>Gabriel</h1>
<h2>19 anos</h2>

<p>Você está convidado!</p>
<p>📅 21 de novembro de 2026</p>
<p>🕖 19:00</p>

<input
  type="text"
  id="nome"
  placeholder="Digite seu primeiro nome"
  maxlength="30"
>

<div class="aviso">Digite apenas seu primeiro nome.</div>

<button id="botao" onclick="confirmar()">
  Confirmar presença
</button>

<div id="mensagem"></div>

<h3>Lista de confirmados</h3>
<ul id="lista"></ul>

<div class="rodape">Feito por Thyago Santos</div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  runTransaction,
  deleteDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYAYRIVProbKyHQzIMDSHRkpQL1AtXJkQ",
  authDomain: "convite-eb192.firebaseapp.com",
  projectId: "convite-eb192",
  storageBucket: "convite-eb192.firebasestorage.app",
  messagingSenderId: "1054003508417",
  appId: "1:4003508417:web:8c1bce3704adcd6b89d040"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const confirmados = collection(db, "confirmados_gabriel");

function normalizarNome(nome) {
  return nome.trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

window.confirmar = async function() {

  const campo = document.getElementById("nome");
  const botao = document.getElementById("botao");
  const mensagem = document.getElementById("mensagem");

  const nome = campo.value.trim().split(/\s+/)[0];

  if (!nome) {
    mensagem.textContent = "Digite seu nome.";
    return;
  }

  botao.disabled = true;
  mensagem.textContent = "Confirmando presença...";

  try {

    const id = encodeURIComponent(normalizarNome(nome));
    const referencia = doc(confirmados, id);

    await runTransaction(db, async (transacao) => {

      const existente = await transacao.get(referencia);

      if (existente.exists()) {
        throw new Error("NOME_REPETIDO");
      }

      transacao.set(referencia, {
        nome: nome,
        confirmadoEm: serverTimestamp()
      });

    });

    campo.value = "";
    mensagem.textContent = "Presença confirmada com sucesso!";

  } catch (erro) {

    console.error("Erro Firebase:", erro);

    if (erro.message === "NOME_REPETIDO") {
      mensagem.textContent = "Esse nome já confirmou presença!";
    } else {
      mensagem.textContent = "Erro: " + (erro.code || erro.message);
    }

  } finally {
    botao.disabled = false;
  }

};

window.remover = async function(id) {

  const mensagem = document.getElementById("mensagem");

  if (!confirm("Tem certeza que deseja remover este nome?")) {
    return;
  }

  try {

    await deleteDoc(doc(confirmados, id));
    mensagem.textContent = "Nome removido com sucesso!";

  } catch (erro) {

    console.error("Erro ao remover:", erro);
    mensagem.textContent = "Erro ao remover: " + (erro.code || erro.message);

  }

};

onSnapshot(confirmados, (snapshot) => {

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  snapshot.forEach((item) => {

    const dados = item.data();

    const li = document.createElement("li");

    const info = document.createElement("div");
    info.className = "info-nome";

    const nome = document.createElement("span");
    nome.className = "nome-lista";
    nome.textContent = dados.nome;

    const horario = document.createElement("span");
    horario.className = "horario";

    if (dados.confirmadoEm) {
      const data = dados.confirmadoEm.toDate();

      horario.textContent = data.toLocaleString("pt-BR", {
        timeZone: "America/Sao_Paulo",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    } else {
      horario.textContent = "Confirmação anterior";
    }

    info.appendChild(nome);
    info.appendChild(horario);

    const botaoRemover = document.createElement("button");
    botaoRemover.className = "botao-remover";
    botaoRemover.textContent = "Remover";
    botaoRemover.onclick = () => window.remover(item.id);

    li.appendChild(info);
    li.appendChild(botaoRemover);

    lista.appendChild(li);

  });

}, (erro) => {

  console.error("Erro ao carregar lista:", erro);

  document.getElementById("mensagem").textContent =
    "Erro ao carregar lista: " + (erro.code || erro.message);

});

</script>

</body>
</html>
