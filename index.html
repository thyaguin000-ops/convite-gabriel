
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriel 19 Anos</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #020817, #061a33, #07518a);
  color: white;
  text-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 100%;
  max-width: 420px;
  padding: 30px 22px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(100,180,255,0.25);
  border-radius: 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.4);
}

h1 {
  font-size: 34px;
  margin-bottom: 5px;
}

h2 {
  font-size: 23px;
  font-weight: normal;
  margin-top: 5px;
}

p {
  font-size: 17px;
  margin: 14px 0;
}

input {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 20px;
  outline: none;
}

button {
  margin-top: 15px;
  padding: 13px 22px;
  width: 100%;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  background: #1688e8;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.aviso {
  font-size: 13px;
  opacity: 0.7;
  margin-top: 8px;
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 15px;
}

li {
  margin: 8px 0;
  padding: 10px;
  background: rgba(30,130,220,0.18);
  border-radius: 10px;
}

.rodape {
  margin-top: 25px;
  font-size: 13px;
  opacity: 0.55;
}
</style>
</head>

<body>

<div class="card">

<h1>Gabriel</h1>
<h2>19 anos</h2>

<p>Você está convidado!</p>
<p>📅 21 de novembro de 2026</p>
<p>🕖 19:00</p>

<input
  type="text"
  id="nome"
  placeholder="Digite seu primeiro nome"
  maxlength="30"
>

<div class="aviso">Digite apenas seu primeiro nome.</div>

<button id="botao" onclick="confirmar()">
  Confirmar presença
</button>

<h3>Lista de confirmados</h3>
<ul id="lista"></ul>

<div class="rodape">
Feito por Thyago Santos
</div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYAYRIVProbKyHQzIMDSHRkpQL1AtXJkQ",
  authDomain: "convite-eb192.firebaseapp.com",
  projectId: "convite-eb192",
  storageBucket: "convite-eb192.firebasestorage.app",
  messagingSenderId: "1054003508417",
  appId: "1:1054003508417:web:8c1bce3704adcd6b89d040"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Lista exclusiva do Gabriel
const confirmados = collection(db, "confirmados_gabriel");

function normalizarNome(nome) {
  return nome.trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

window.confirmar = async function() {

  const campo = document.getElementById("nome");
  const botao = document.getElementById("botao");

  const nome = campo.value.trim().split(/\s+/)[0];

  if (!nome) {
    alert("Digite seu nome.");
    return;
  }

  botao.disabled = true;

  try {

    const snapshot = await getDocs(confirmados);

    const repetido = snapshot.docs.some(item =>
      normalizarNome(item.data().nome) === normalizarNome(nome)
    );

    if (repetido) {
      alert("Esse nome já confirmou presença!");
      return;
    }

    await addDoc(confirmados, {
      nome: nome
    });

    campo.value = "";
    alert("Presença confirmada com sucesso!");

  } catch (erro) {
    console.error(erro);
    alert("Não foi possível confirmar. Tente novamente.");
  } finally {
    botao.disabled = false;
  }

};

onSnapshot(confirmados, (snapshot) => {

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  snapshot.forEach((item) => {
    const li = document.createElement("li");
    li.textContent = item.data().nome;
    lista.appendChild(li);
  });

});

</script>

</body>
</html>
