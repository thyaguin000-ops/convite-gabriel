
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriel 18 Anos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #020308, #071b3d, #003b70);
    color: white;
    text-align: center;
    min-height: 100vh;
}

.card {
    max-width: 420px;
    margin: 40px auto;
    padding: 28px 22px;
    background: rgba(10, 20, 40, 0.78);
    border: 1px solid rgba(0, 140, 255, 0.35);
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(0, 110, 255, 0.25);
}

h1 {
    color: #39a9ff;
    font-size: 36px;
    text-shadow: 0 0 15px #007bff;
}

h2 {
    color: #d8eaff;
}

h3 {
    color: #39a9ff;
    margin-top: 28px;
}

p {
    line-height: 1.6;
}

.destaque {
    color: #54b7ff;
    font-weight: bold;
}

input {
    width: 90%;
    padding: 12px;
    border: 1px solid #168cff;
    border-radius: 10px;
    font-size: 16px;
    margin-top: 15px;
    outline: none;
    background: #101b2d;
    color: white;
}

input::placeholder {
    color: #aabbd0;
}

button {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    background: #168cff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #006bd6;
}

ul {
    list-style: none;
    padding: 0;
    margin-top: 15px;
}

li {
    margin: 8px 0;
    padding: 10px;
    background: rgba(0, 120, 255, 0.15);
    border: 1px solid rgba(0, 140, 255, 0.2);
    border-radius: 10px;
}

.aviso {
    font-size: 13px;
    opacity: 0.7;
    margin-top: 8px;
}

.rodape {
    margin: 35px auto 10px;
    text-align: center;
    font-size: 14px;
    color: rgba(255,255,255,0.55);
}
</style>
</head>

<body>

<div class="card">

<h1> Gabriel </h1>
<h2>18 Anos</h2>

<p class="destaque">Uma noite, uma festa e muitas histórias!</p>

<p>🖤 Tema: Noite Azul e Preta</p>
<p>📅 21 de Novembro de 2026</p>
<p>🕖 19:00</p>

<input type="text" id="nome" placeholder="Digite seu primeiro nome">

<div class="aviso">⚠ Apenas o primeiro nome</div>

<br>

<button onclick="confirmar()">Confirmar Presença</button>

<h3>Lista de Confirmados</h3>
<ul id="lista"></ul>

</div>

<div class="rodape">
Feito por Thyago Santos
</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAYAYRIVProbKyHQzIMDSHRkpQL1AtXJkQ",
authDomain: "convite-eb192.firebaseapp.com",
projectId: "convite-eb192",
storageBucket: "convite-eb192.firebasestorage.app",
messagingSenderId: "1054003508417",
appId: "1:4003508417:web:8c1bce3704adcd6b89d040"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const confirmados = collection(db, "confirmados");

function pegarPrimeiroNome(nome) {
    return nome.trim().split(/\s+/)[0];
}

window.confirmar = async function() {

    const campo = document.getElementById("nome");
    const nomeCompleto = campo.value;

    if (nomeCompleto.trim() === "") {
        alert("Digite seu nome");
        return;
    }

    const nome = pegarPrimeiroNome(nomeCompleto);
    const nomeVerificar = nome.toLowerCase();

    try {
        const querySnapshot = await getDocs(confirmados);

        let repetido = false;

        querySnapshot.forEach((item) => {
            if (item.data().nome.toLowerCase() === nomeVerificar) {
                repetido = true;
            }
        });

        if (repetido) {
            alert("Esse nome já confirmou presença.");
            return;
        }

        await addDoc(confirmados, {
            nome: nome
        });

        campo.value = "";
        alert("Presença confirmada!");

    } catch (erro) {
        alert("Não foi possível confirmar. Tente novamente.");
        console.error(erro);
    }
};

onSnapshot(confirmados, (snapshot) => {

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    snapshot.forEach((item) => {
        const li = document.createElement("li");
        li.textContent = item.data().nome;
        lista.appendChild(li);
    });

}, (erro) => {
    console.error("Erro ao carregar a lista:", erro);
});

</script>

</body>
</html>
